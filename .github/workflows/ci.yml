name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build DownloadManager.sln -c Release
      - name: Test
        run: dotnet test tests/DownloadManager.Core.Tests -c Release --no-build
      - name: Check extension scripts
        shell: pwsh
        run: |
          Get-ChildItem extension -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
